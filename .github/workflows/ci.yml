# Checks every pull request and every branch push: typecheck, import
# boundaries, single three.js, unit tests, and a production build.
# To block merging on failures: Settings > Branches > add a rule for main,
# require status checks to pass, and select "check".
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by the Pages workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
